name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: app
            artifact: car
          - module: phone
            artifact: phone

    outputs:
      version-name: ${{ steps.version.outputs.name }}
      version-code: ${{ steps.version.outputs.code }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          CODE=$(echo "$VERSION" | awk -F. '{ printf "%d", ($1 * 10000) + ($2 * 100) + $3 }')
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION (code=$CODE)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Accept Android licenses
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode signing key
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "$SIGNING_KEY" | base64 -d > app/release-key.jks
            echo "Release keystore decoded"
          else
            echo "No SIGNING_KEY secret; assembling debug-signed release APK"
          fi
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}

      - name: Build ${{ matrix.module }} release
        run: |
          ./gradlew :${{ matrix.module }}:assembleRelease \
            -PversionName=${{ steps.version.outputs.name }} \
            -PversionCode=${{ steps.version.outputs.code }} \
            --stacktrace --no-daemon
        env:
          SIGNING_KEY_FILE: ${{ github.workspace }}/app/release-key.jks
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}

      - name: Package release APK
        run: |
          mkdir -p dist
          shopt -s nullglob
          apks=(${{ matrix.module }}/build/outputs/apk/release/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "No APK found under ${{ matrix.module }}/build/outputs/apk/release"
            find ${{ matrix.module }}/build/outputs -type f -print || true
            exit 1
          fi
          cp "${apks[0]}" "dist/CarWithYou-${{ matrix.artifact }}-v${{ steps.version.outputs.name }}.apk"
          ls -lh dist

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-release
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify APKs
        run: |
          echo "Downloaded artifacts:"
          find artifacts -type f -print
          count=$(find artifacts -name '*.apk' | wc -l)
          if [ "$count" -lt 2 ]; then
            echo "Expected 2 APKs, found $count"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          name: ${{ github.ref_name }}
          body_path: CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
